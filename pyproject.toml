[project]
name = "agentlens"
version = "0.1.0"
description = "Tracing, replay, and regression testing for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
dashboard = ["streamlit>=1.30"]

[project.scripts]
agentlens = "agentlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
